<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Alerts: price alerts for 10,000+ coins</title>
<meta name="description" content="Get a Telegram message when any coin hits your price or moves by a percent.">
<style>
:root{--bg:#f1f4f6;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d8e0e6;--accent:#1b5e9b;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e6edf2;--mute:#93a3b0;--line:#2a3743;--accent:#6aaee8;--bad:#f2867f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.6rem;margin:8px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}
p{color:var(--mute);margin:0 0 14px}a{color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:600}
button.ghost{background:none;color:var(--mute);border:1px solid var(--line);width:auto;padding:4px 10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}#results li{cursor:pointer}#results li:hover{color:var(--accent)}
#msg{color:var(--bad);min-height:1.4em}.hide{display:none}small{color:var(--mute)}
</style></head><body><main>
<h1>Coin Alerts</h1>
<p>Telegram alerts for 10,000+ coins. New accounts get 7 days of Pro. <a href="trending.html">See trending coins</a></p>
<div id="msg" role="status"></div>

<section id="auth"><h2>Sign in</h2>
<input id="email" type="email" placeholder="you@email.com" autocomplete="email">
<div class="row"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"></div>
<div class="row"><button id="login">Sign in</button><button id="signup" class="ghost" style="width:100%;padding:10px 12px">Create account</button></div></section>

<div id="app" class="hide">
<section id="tgbox"><h2>Telegram</h2><p id="tgtext"></p>
<a id="tglink" target="_blank" rel="noopener"><button>Connect Telegram</button></a></section>

<section><h2>New alert</h2>
<input id="q" placeholder="Search a coin (bitcoin, pepe, sol)" autocomplete="off"><ul id="results"></ul>
<div id="picked" class="hide"><p id="pickedName" style="margin:10px 0 0;color:var(--ink)"></p>
<div class="row"><select id="kind"><option value="above">Goes above</option><option value="below">Drops below</option><option value="move">Moves by %</option></select>
<input id="target" type="number" step="any" min="0" placeholder="USD price"></div>
<div class="row"><button id="add">Create alert</button></div></div>
<div class="row"><button class="ghost" data-depeg="tether">Watch USDT depeg</button><button class="ghost" data-depeg="usd-coin">Watch USDC depeg</button></div></section>

<section><h2>Your alerts</h2><p id="plan"></p><ul id="alerts"></ul>
<div class="row"><button id="upgrade">Pay with crypto: 30 days of Pro</button></div></section>
<button class="ghost" id="logout">Sign out</button>
<p style="margin-top:16px"><small>Alerts are notifications only, not financial advice. Prices come from CoinGecko and may be delayed.</small></p>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
// Paste your own values (the anon key is safe to expose: row-level security protects data)
const SUPABASE_URL="https://qkuretekuhvqprleqpub.supabase.co", SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdXJldGVrdWh2cXBybGVxcHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MjQ0NTEsImV4cCI6MjExMTMwMDQ1MX0.cUyDwW32iDrqg3fwvlOW2KpZPQjKIqv_Aq65_XJZZ0w", BOT_USERNAME="MyCoinAlerts2026_bot";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);
const say=t=>$("msg").textContent=t||"";let coins=[],picked=null,prof=null;
const price=async id=>{const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`);return r.ok?(await r.json())[id]?.usd:null};

async function loadCoins(){
  try{const c=JSON.parse(localStorage.getItem("coins")||"null");if(c&&Date.now()-c.t<864e5)coins=c.list}catch(e){}
  if(!coins.length){const r=await fetch("https://api.coingecko.com/api/v3/coins/list");
    if(!r.ok)return say("Coin list is busy. Try again in a minute.");coins=await r.json();
    try{localStorage.setItem("coins",JSON.stringify({t:Date.now(),list:coins}))}catch(e){}}
  const want=new URLSearchParams(location.search).get("coin");const c=coins.find(x=>x.id===want);if(c)pick(c);
}
function pick(c){picked=c;$("results").innerHTML="";$("q").value="";$("picked").classList.remove("hide");$("pickedName").textContent=c.name}
$("q").oninput=()=>{const q=$("q").value.trim().toLowerCase(),ul=$("results");ul.innerHTML="";if(q.length<2)return;
  const hits=coins.filter(c=>c.symbol===q||c.id.startsWith(q)||c.name.toLowerCase().startsWith(q)).slice(0,8);
  if(!hits.length)ul.innerHTML="<li>No coin found. Try the full name.</li>";
  hits.forEach(c=>{const li=document.createElement("li");li.textContent=`${c.name} (${c.symbol.toUpperCase()})`;li.onclick=()=>pick(c);ul.appendChild(li)})};
$("kind").onchange=()=>$("target").placeholder=$("kind").value==="move"?"% change":"USD price";

async function create(coin,kind,target){
  const row={coin_id:coin.id,coin_name:coin.name,kind,target};
  if(kind==="move"){row.base_price=await price(coin.id);if(!row.base_price)return say("Could not fetch the price. Try again shortly.")}
  const{error}=await sb.from("alerts").insert(row);say(error?error.message:"");if(!error)refresh();return!error}
$("add").onclick=async()=>{const t=parseFloat($("target").value);if(!picked||!(t>0))return say("Choose a coin and enter a number above 0.");
  if(await create(picked,$("kind").value,t)){$("target").value="";$("picked").classList.add("hide");picked=null}};
document.querySelectorAll("[data-depeg]").forEach(b=>b.onclick=()=>create({id:b.dataset.depeg,name:b.textContent.replace("Watch ","").replace(" depeg","")},"below",0.98));

async function refresh(){
  const{data:p}=await sb.from("profiles").select("plan,pro_until,telegram_chat_id,link_token").single();prof=p;
  const pro=p&&(p.plan==="pro"||new Date(p.pro_until)>new Date());
  $("tgbox").classList.toggle("hide",!!p?.telegram_chat_id);
  $("tgtext").textContent="Connect once so alerts can reach you.";
  if(p)$("tglink").href=`https://t.me/${BOT_USERNAME}?start=${p.link_token}`;
  const{data}=await sb.from("alerts").select("*").order("created_at",{ascending:false});
  const act=(data||[]).filter(a=>a.active).length;
  $("plan").textContent=p?.plan==="pro"?"Pro: unlimited alerts.":pro?`Pro until ${new Date(p.pro_until).toLocaleDateString()}. Free plan: 3 alerts.`:`${act} of 3 free alerts used.`;
  const ul=$("alerts");ul.innerHTML="";if(!data?.length)ul.innerHTML="<li>No alerts yet. Search a coin above.</li>";
  (data||[]).forEach(a=>{const li=document.createElement("li"),s=document.createElement("span"),b=document.createElement("button");
    const what=a.kind==="move"?`moves ${a.target}%`:`${a.kind==="above"?"above":"below"} $${a.target}`;
    s.textContent=`${a.coin_name} ${what}${a.active?"":" (sent)"}`;b.className="ghost";b.textContent="Delete";
    b.onclick=async()=>{await sb.from("alerts").delete().eq("id",a.id);refresh()};li.append(s,b);ul.appendChild(li)})}

$("upgrade").onclick=async()=>{const{data,error}=await sb.functions.invoke("crypto-checkout");error?say("Checkout failed. Try again."):location.href=data.url};
const creds=()=>{const email=$("email").value.trim(),password=$("pw").value;if(!email||password.length<8){say("Enter your email and a password of 8 or more characters.");return null}return{email,password}};
const busy=async(btn,label,fn)=>{const c=creds();if(!c)return;const t=btn.textContent;btn.disabled=true;btn.textContent=label;say("Please wait...");
  try{await fn(c)}catch(e){say("Error: "+(e&&e.message?e.message:e))}finally{btn.disabled=false;btn.textContent=t}};
$("login").onclick=()=>busy($("login"),"Signing in...",async c=>{const{error}=await sb.auth.signInWithPassword(c);say(error?"Sign-in failed: "+error.message:"")});
$("signup").onclick=()=>busy($("signup"),"Creating...",async c=>{const{data,error}=await sb.auth.signUp(c);
  say(error?"Could not create account: "+error.message:(data.session?"":"Account created. Now tap Sign in."))});
$("logout").onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_e,s)=>{$("auth").classList.toggle("hide",!!s);$("app").classList.toggle("hide",!s);if(s){loadCoins();refresh()}});
</script></body></html>
